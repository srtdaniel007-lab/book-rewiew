services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: bookreads-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # 2. React Frontend Static Site
  - type: web
    name: bookreads-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bookreads-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
